# Render Deployment Configuration
# Deploy to: https://render.com/

services:
  # API Gateway Service
  - type: web
    name: structural-ai-api
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: npm install
    startCommand: node src/api/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: PIPELINE_SERVICE_URL
        value: https://your-runpod-url.runpod.net
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
    healthCheckPath: /health
    disk:
      name: logs
      mountPath: /app/logs
      sizeGB: 1

# For the Python GPU service, use RunPod or Modal instead
# Render doesn't support GPU workloads natively
