version: '3.8'

services:
  structural-ai:
    build: .
    ports:
      - "5000:5000"
    environment:
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cuda
      - SPACY_MODEL=en_core_web_lg
      - API_HOST=0.0.0.0
      - API_PORT=5000
    volumes:
      - ./models:/app/models
      - ./nltk_data:/app/nltk_data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development service without GPU
  structural-ai-cpu:
    build: .
    ports:
      - "5001:5000"
    environment:
      - WHISPER_MODEL=tiny
      - WHISPER_DEVICE=cpu
      - SPACY_MODEL=en_core_web_sm
      - API_HOST=0.0.0.0
      - API_PORT=5000
    volumes:
      - .:/app
    profiles:
      - cpu
